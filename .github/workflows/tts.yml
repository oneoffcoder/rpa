name: TTS and book checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tts-tests:
    name: TTS tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.13.9"
      - name: Create Python 3.12 environment
        run: uv venv .venv --python 3.12
      - name: Install package and dev tools
        run: uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run tests
        run: .venv/bin/python -m pytest -q
      - name: Lint
        run: .venv/bin/ruff check src tests
      - name: Format check
        run: .venv/bin/ruff format --check src tests

  book-build:
    name: Sphinx book build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pillow 9.5.0 (required by blockdiag's ImageDraw.textsize use) has
          # Linux cp311 wheels but no cp312 manylinux wheel.
          python-version: "3.11"
      - name: Install pinned documentation environment
        run: python -m pip install -r requirements-docs.txt
      - name: Build the book
        run: sphinx-build -M html source build -E
      - name: Confirm build output exists
        run: test -f build/html/index.html
